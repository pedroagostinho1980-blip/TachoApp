name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: # permite correr manualmente no separador Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Testes do motor de regras
        run: gradle :core:test --no-daemon

      - name: Compilar APK (debug, já assinada para instalação direta)
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TemposDeConducao-APK
          path: app/build/outputs/apk/debug/app-debug.apk
